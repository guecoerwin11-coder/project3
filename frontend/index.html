<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SkillBridge</title>
    <meta name="description" content="See how close your skills are to real jobs, and what to learn next">
    <meta name="theme-color" content="#333333">
    <script>
        // Apply the saved dark/light choice before anything is drawn (no white flash)
        try{
            var t = localStorage.getItem('skillbridge.theme')
            if(t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
        }catch(e){}
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%23e73125%22/%3E%3Cg class=%22mark%22%3E%3Cpath d=%22M5 21c5-8 17-8 22 0%22 stroke=%22%23fff%22 stroke-width=%223%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3Cpath d=%22M9 21v4M23 21v4M16 15v10%22 stroke=%22%23fff%22 stroke-width=%223%22 stroke-linecap=%22round%22/%3E%3C/g%3E%3C/svg%3E">
    <!-- Geometric display face for headings; falls back to the system font when offline -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div id="app"><p class="boot">Loading SkillBridge…</p></div>
    <div id="tooltip" role="tooltip" hidden></div>
    <div id="toasts" aria-live="polite"></div>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
